<style>
:root{
  --paper:#FFFFFF; --paper-2:#F6F4EF; --paper-3:#ECE8DF;
  --ink:#2A2521; --ink-2:#5E554D; --ink-3:#8A8078;
  --line:rgba(42,37,33,.13); --line-2:rgba(42,37,33,.28);
  --sun:#C9951F; --sun-wash:#FBF1D6;
  --moon:#5B7186; --moon-wash:#E6ECF1;
  --verm:#C4392A; --verm-wash:#FBE9E5; --verm-ink:#FFF7F2;
  --ok:#3F7D5A; --ok-wash:#E4F1E8;
  --part:var(--ink); --part-wash:var(--paper-2);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro","Helvetica Neue",Arial,sans-serif;
  --sc:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1F1B18; --paper-2:#28231F; --paper-3:#332D27;
    --ink:#F1E8DA; --ink-2:#BFB3A4; --ink-3:#8E8478;
    --line:rgba(241,232,218,.13); --line-2:rgba(241,232,218,.3);
    --sun:#D9AB45; --sun-wash:#3A3020;
    --moon:#A7B9CA; --moon-wash:#2A3138;
    --verm:#E0624F; --verm-wash:#3A2420; --verm-ink:#FFF7F2;
    --ok:#7CC49A; --ok-wash:#1F3328;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1F1B18; --paper-2:#28231F; --paper-3:#332D27;
  --ink:#F1E8DA; --ink-2:#BFB3A4; --ink-3:#8E8478;
  --line:rgba(241,232,218,.13); --line-2:rgba(241,232,218,.3);
  --sun:#D9AB45; --sun-wash:#3A3020;
  --moon:#A7B9CA; --moon-wash:#2A3138;
  --verm:#E0624F; --verm-wash:#3A2420; --verm-ink:#FFF7F2;
  --ok:#7CC49A; --ok-wash:#1F3328;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:5rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.sc{font-family:var(--sc);font-weight:400}
:focus-visible{outline:2px solid var(--verm);outline-offset:3px;border-radius:3px}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;overflow-x:hidden;padding:2rem 1.25rem;background:
  radial-gradient(80% 60% at 15% 10%,var(--sun-wash),transparent 60%),
  radial-gradient(70% 60% at 90% 95%,var(--moon-wash),transparent 60%),var(--paper)}
.gate-card{width:min(26rem,100%);min-width:0;justify-self:center;display:grid;gap:1.1rem;text-align:left}
.gate-logo{width:84px;height:auto}
.gate h1{font-family:var(--serif);font-weight:400;font-size:2.2rem;line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
.gate p{margin:0;color:var(--ink-2)}
.gate form{display:grid;gap:.6rem;margin-top:.4rem}
.gate label{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.gate-row{display:flex;gap:.5rem}
.gate input{flex:1;min-width:0;width:100%;padding:.85rem 1rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);font-size:1.05rem;letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.3rem;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--verm);border-color:var(--verm);color:var(--verm-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gate input:focus,.gate input:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sun-wash)}
@media (max-width:480px){.gate-row{flex-direction:column}.gate .btn{width:100%;padding:.95rem 1.3rem}.gate h1{font-size:1.9rem}}
.gate-msg{min-height:1.5em;font-size:.92rem;color:var(--verm)}
.gate-foot{font-size:.82rem;color:var(--ink-3)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:1rem;padding:.7rem clamp(1rem,3vw,2rem)}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;min-width:0}
.brand img{width:34px;height:auto}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.12rem;white-space:nowrap}
.brand span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.prog{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .7rem;border-radius:999px;font-size:.74rem;font-weight:600;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.pick{background:none;font:inherit;font-size:.74rem;font-weight:600;cursor:pointer}
.chip.pick:hover{border-color:var(--ink)}
.chip.pick.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.done{background:var(--ok-wash);border-color:transparent;color:var(--ok)}
.chip.lock{color:var(--ink-3);border-style:dashed}
.menu-btn{white-space:nowrap;flex:none;display:none;border:1px solid var(--line-2);background:none;border-radius:999px;padding:.35rem .85rem;font-size:.78rem;font-weight:600;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:17.5rem minmax(0,1fr);gap:clamp(2rem,4vw,4rem);width:min(1240px,100%);margin-inline:auto;padding:0 clamp(1rem,3vw,2rem)}
.rail{position:sticky;top:var(--toph,4.2rem);align-self:start;max-height:calc(100vh - var(--toph,4.2rem));overflow:auto;padding:2rem 0 3rem;font-size:.9rem}
.rail h4{margin:1.4rem 0 .4rem;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--part);display:flex;align-items:center;gap:.45rem}
.rail h4:first-child{margin-top:0}
.rail h4 .sc{font-size:.95rem;letter-spacing:0}
.rail ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.rail li a{display:grid;grid-template-columns:2.6rem 1fr;gap:.3rem;padding:.28rem .6rem .28rem .8rem;margin-left:-1px;border-left:2px solid transparent;text-decoration:none;color:var(--ink-2);line-height:1.35}
.rail li a .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:.8rem;padding-top:.1rem}
.rail li a:hover{color:var(--ink)}
.rail li a.on{color:var(--ink);border-left-color:var(--part);font-weight:600}
.rail li.locked a{color:var(--ink-3);pointer-events:none}
.rail .lockline{font-size:.8rem;color:var(--ink-3);padding:.4rem .8rem;border-left:1px dashed var(--line-2);margin-left:-1px}
[data-p="1"]{--part:var(--sun);--part-wash:var(--sun-wash)}
[data-p="A"]{--part:var(--verm);--part-wash:var(--verm-wash)}
[data-p="B"]{--part:var(--moon);--part-wash:var(--moon-wash)}
[data-p="P"]{--part:var(--ink-2);--part-wash:var(--paper-2)}
[data-p="Q"]{--part:var(--ok);--part-wash:var(--ok-wash)}

/* ---------- document ---------- */
main{padding:2.5rem 0 6rem;max-width:46rem}
main p{margin:0 0 1rem}
main ul,main ol{margin:0 0 1rem;padding-left:1.2rem}
main li{margin:.28rem 0}
main li::marker{color:var(--part)}
main b{font-weight:600}
section{padding:2.2rem 0;border-top:1px solid var(--line)}
.part-head+section{border-top:0}
section>h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.45rem,2.4vw,1.8rem);line-height:1.2;margin:0 0 1rem;letter-spacing:-.005em;text-wrap:balance;display:flex;gap:.8rem;align-items:baseline}
section>h2 .no{font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--part);font-variant-numeric:tabular-nums;flex:none;min-width:2.6rem}
h3{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:1.5rem 0 .55rem}
.acc-b h3.sub{font-family:var(--serif);font-weight:500;font-size:1.22rem;letter-spacing:-.005em;text-transform:none;color:var(--ink);margin:2rem 0 .7rem;padding-top:1.3rem;border-top:1px dashed var(--line-2)}
.acc-b h3.sub:first-child{margin-top:.2rem;padding-top:0;border-top:0}
h4{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:1.3rem 0 .5rem}
.two h4:first-child,.three h4:first-child{margin-top:0}
.intro{border-top:0;padding-top:.5rem}
.kicker{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:.6rem}
.kicker .sc{white-space:nowrap;color:var(--verm);font-size:1rem;letter-spacing:.2em}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.3rem,5vw,3.5rem);line-height:1.04;letter-spacing:-.015em;margin:.6rem 0 1.2rem;text-wrap:balance}
.lede{font-family:var(--serif);font-size:clamp(1.15rem,1.8vw,1.35rem);line-height:1.5;color:var(--ink)}
.lede b{font-weight:600}
.path{counter-reset:p;list-style:none;padding:0!important;display:grid;gap:.1rem;margin:1.4rem 0!important;border-top:1px solid var(--line)}
.path li{counter-increment:p;position:relative;padding:.7rem 0 .7rem 2.2rem;border-bottom:1px solid var(--line);margin:0}
.path li::before{content:counter(p);position:absolute;left:0;top:.62rem;font-family:var(--serif);font-size:1.3rem;color:var(--verm);line-height:1.3}
.path.nav li{padding:0;counter-increment:p}
.path.nav li::before{left:.35rem;top:.72rem;pointer-events:none;z-index:1}
.path-link{display:block;padding:.75rem 2.4rem .75rem 2.4rem;margin-left:0;text-decoration:none;color:inherit;border-radius:var(--r);position:relative;transition:background .15s ease}
.path-link::after{content:"→";position:absolute;right:.7rem;top:50%;transform:translateY(-50%);color:var(--ink-3);transition:transform .15s ease,color .15s ease}
.path-link:hover{background:var(--paper-2)}
.path-link:hover::after{color:var(--verm);transform:translate(3px,-50%)}
.motto{font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.5;padding-left:1rem;border-left:2px solid var(--verm);color:var(--ink)}

.part-head{position:relative;overflow:hidden;margin:3rem 0 0;padding:2.4rem 1.6rem 2rem;border-radius:var(--r);background:var(--part-wash);isolation:isolate}
.part-head::after{content:attr(data-glyph);position:absolute;right:-.06em;bottom:-.3em;z-index:-1;font-family:var(--sc);font-size:clamp(8rem,20vw,12rem);line-height:1;color:var(--part);opacity:.12;pointer-events:none}
.part-no{margin:0 0 .3rem!important;font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--part)}
.part-no .sc{display:none}
.part-title{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,2.8rem);line-height:1.05;margin:0 0 .6rem;letter-spacing:-.01em;text-wrap:balance}
.part-head p:last-child{margin:0;color:var(--ink-2);max-width:34rem}

.tbl{overflow-x:auto;margin:0 0 1.2rem;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:.65rem .85rem;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-2);background:var(--paper-2)}
td:first-child{font-weight:500}
td[rowspan]{background:var(--paper-2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{display:block;font-size:.8rem;color:var(--ink-3);font-weight:400}
.note{font-size:.9rem;color:var(--ink-2)}
.py{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88em;background:var(--paper-2);padding:.05em .35em;border-radius:3px}
td .sc,li .sc,p .sc{font-size:1.05em}

.quote{margin:0 0 1.4rem;padding:1.3rem 1.4rem;background:var(--sun-wash);border-radius:var(--r)}
.quote p{font-family:var(--serif);font-size:1.3rem;line-height:1.4;margin:0 0 .4rem}
.quote cite{font-style:normal;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 1.4rem}
.values>div{background:var(--paper);padding:1rem 1.1rem;display:grid;grid-template-columns:2.4rem 1fr;column-gap:.6rem}
.values .sc{grid-row:span 2;font-size:1.9rem;line-height:1;color:var(--part)}
.values p{margin:0;font-size:.9rem;color:var(--ink-2)}
.steps{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.steps li{margin:0;display:grid;gap:.15rem;padding:1rem;border:1px solid var(--line);border-radius:var(--r);position:relative}
.steps li .sc{font-size:1.5rem;color:var(--part);line-height:1.2}
.steps li span:last-child{font-size:.86rem;color:var(--ink-2);line-height:1.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem}
.two h3:first-child,.three h3:first-child{margin-top:0}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem}
.checklist>div{padding:1rem 1.1rem;border:1px solid var(--line);border-radius:var(--r)}
.checklist ul{list-style:none;padding:0;margin:0}
.checklist li{padding-left:1.5rem;position:relative;font-size:.92rem}
.checklist li::before{content:"";position:absolute;left:0;top:.35em;width:.85em;height:.85em;border:1.5px solid var(--line-2);border-radius:3px}
ul.checks{list-style:none;padding:0}
ul.checks li{padding:.55rem 0 .55rem 1.8rem;position:relative;border-bottom:1px solid var(--line);margin:0}
ul.checks li:last-child{border-bottom:0}
ul.checks li::before{content:"";position:absolute;left:.1rem;top:.95em;width:.9em;height:.9em;border:1.5px solid var(--part);border-radius:3px}

.msg{margin:0 0 1rem;padding:1rem 1.2rem;background:var(--paper-2);border-radius:var(--r);border-left:3px solid var(--part)}
.msg p{margin:0}
.msg-label{font-size:.7rem!important;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin-bottom:.35rem!important}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin:0 0 1.2rem}
.compare>div{padding:.9rem 1.1rem;border-radius:var(--r)}
.compare p{margin:0}
.compare .bad{background:var(--verm-wash)}
.compare .bad .msg-label{color:var(--verm)}
.compare .bad p:last-child{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--verm) 55%,transparent);text-decoration-thickness:1px}
.compare .good{background:var(--ok-wash)}
.compare .good .msg-label{color:var(--ok)}

.danger ol.redline{list-style:none;padding:0;margin:0;counter-reset:r;border-top:1px solid var(--line)}
.redline li{counter-increment:r;position:relative;padding:.6rem 0 .6rem 2.4rem;border-bottom:1px solid var(--line);margin:0}
.redline li::before{content:counter(r,decimal-leading-zero);position:absolute;left:0;top:.8rem;font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;color:var(--ink-3);line-height:1.3}
.redline li.red{font-weight:500}
.redline li.red::after{content:"●";position:absolute;left:1.45rem;top:.72rem;color:var(--verm);font-size:.75rem;line-height:1.3}
.mark{color:var(--verm)}
.words{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 1.2rem}
.words span{padding:.3rem .75rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--verm) 40%,transparent);color:var(--verm);font-size:.9rem;text-decoration:line-through;text-decoration-thickness:1px}
.games{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;counter-reset:g}
.games li{counter-increment:g;margin:0;padding:.75rem .9rem;border:1px solid var(--line);border-radius:var(--r);display:grid}
.games li b::before{content:counter(g) ". ";color:var(--part);font-variant-numeric:tabular-nums}
.games li span{font-size:.82rem;color:var(--ink-3)}
.criteria{columns:2;column-gap:2rem}
.criteria li{break-inside:avoid}
details.case{border:1px solid var(--line);border-radius:var(--r);margin:0 0 .6rem;background:var(--paper)}
details.case summary{cursor:pointer;padding:.85rem 2.6rem .85rem 1rem;list-style:none;position:relative;line-height:1.5}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"+";position:absolute;right:1rem;top:.75rem;font-size:1.2rem;color:var(--part);font-weight:500}
details.case[open] summary::before{content:"–"}
details.case[open] summary{border-bottom:1px dashed var(--line-2)}
details.case p{margin:0;padding:.85rem 1rem 1rem;background:var(--part-wash);border-radius:0 0 var(--r) var(--r)}
.btn-link{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;text-decoration:none;padding:.65rem 1.1rem;border-radius:999px;border:1px solid var(--part);color:var(--part)}
.btn-link:hover{background:var(--part);color:var(--paper)}
.btn-link::after{content:"↗"}

/* ---------- cách làm việc ---------- */
figure.saying{margin:0 0 1rem;padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
figure.saying blockquote{margin:0;font-family:var(--serif);font-size:1.18rem;line-height:1.45;color:var(--ink)}
figure.saying figcaption{margin:.35rem 0 0;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
figure.saying .ours{margin:.7rem 0 0;padding-top:.7rem;border-top:1px dashed var(--line-2);font-size:.95rem;color:var(--ink-2)}
figure.saying .ours b{color:var(--part)}
.proverbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin:0 0 1.2rem}
.proverbs>div{padding:.9rem 1rem;border-radius:var(--r);background:var(--part-wash)}
.proverbs b{display:block;font-family:var(--serif);font-weight:500;font-size:1.05rem;line-height:1.35;margin-bottom:.35rem}
.proverbs p{margin:0;font-size:.92rem;color:var(--ink-2)}
.proverbs.jokes>div{background:var(--sun-wash)}
.chain{list-style:none;padding:0!important;margin:1.2rem 0!important;display:grid;gap:0;counter-reset:c}
.chain li{counter-increment:c;position:relative;margin:0;padding:.8rem 0 .8rem 2.6rem;border-left:2px solid var(--part);margin-left:.9rem;display:grid;gap:.15rem}
.chain li::before{content:counter(c);position:absolute;left:-.95rem;top:.75rem;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--part);color:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.chain li span{font-size:.92rem;color:var(--ink-2)}
.welcome{position:relative;overflow:hidden;isolation:isolate;margin:0 0 2.2rem;padding:1.6rem 1.5rem 1.5rem;border-radius:var(--r);background:
  radial-gradient(90% 80% at 0% 0%,var(--sun-wash),transparent 65%),
  radial-gradient(80% 80% at 100% 100%,var(--moon-wash),transparent 65%),var(--paper-2)}
.welcome::after{content:"日月";position:absolute;right:-.05em;top:-.12em;z-index:-1;font-family:var(--sc);font-size:7.5rem;line-height:1;color:var(--verm);opacity:.07;pointer-events:none}
.welcome .hi-zh{margin:0;font-family:var(--sc);font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.2;color:var(--verm)}
.welcome .hi-py{margin:.15rem 0 0;font-size:.82rem;letter-spacing:.06em;color:var(--ink-3)}
.welcome .hi-vi{margin:.6rem 0 0;font-family:var(--serif);font-size:clamp(1.35rem,3vw,1.7rem);line-height:1.2}
.welcome .hi-sub{margin:.4rem 0 0;color:var(--ink-2);font-size:.96rem}
.welcome figure{margin:1.2rem 0 0;padding:1.1rem 1.2rem;border-radius:var(--r);background:var(--paper)}
.welcome .lbl{margin:0 0 .5rem;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--verm)}
.welcome .lbl .sc{letter-spacing:.1em;text-transform:none;font-size:.85rem}
.welcome blockquote{margin:0;font-family:var(--sc);font-size:clamp(1.35rem,3.4vw,1.7rem);line-height:1.4}
.welcome .py-line{margin:.2rem 0 0;font-size:.88rem;color:var(--ink-3)}
.welcome .vi-line{margin:.5rem 0 0;font-family:var(--serif);font-size:1.12rem;line-height:1.45}
.welcome figcaption{margin:.3rem 0 0;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.welcome .ours{margin:.7rem 0 0;padding-top:.7rem;border-top:1px dashed var(--line-2);font-size:.93rem;color:var(--ink-2)}
.welcome .ours b{color:var(--verm)}
figure.saying.zh blockquote{font-family:var(--sc);font-size:1.3rem}
figure.saying .py-line{margin:.2rem 0 0;font-size:.86rem;color:var(--ink-3)}
figure.saying .vi-line{margin:.35rem 0 0;font-family:var(--serif);font-size:1.05rem}
@media (max-width:640px){.proverbs{grid-template-columns:minmax(0,1fr)}}

/* ---------- accordion ---------- */
section.acc{padding:0;border-top:1px solid var(--line)}
section.acc>h2{margin:0;display:block}
.acc-t{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:.8rem;align-items:baseline;width:100%;padding:1.05rem 2.2rem 1.05rem 0;position:relative;font-family:var(--serif);font-weight:500;font-size:clamp(1.2rem,2.2vw,1.45rem);line-height:1.3;color:var(--ink);text-wrap:balance}
.acc-t:hover{color:var(--part)}
.acc-t:focus-visible{outline:2px solid var(--verm);outline-offset:2px;border-radius:3px}
.acc-t .no{font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--part);font-variant-numeric:tabular-nums;flex:none;min-width:2.6rem}
.acc-t::after{content:"";position:absolute;right:.4rem;top:50%;width:.55rem;height:.55rem;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);transition:transform .2s ease}
section.acc.open .acc-t::after{transform:translateY(-30%) rotate(-135deg)}
.acc-b{display:none;padding:0 0 2rem 3.4rem}
section.acc.open .acc-b{display:block}
.sub-acc{border-top:1px solid var(--line)}
.sub-acc:last-child{border-bottom:1px solid var(--line)}
.sub-t{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:.8rem 2rem .8rem 0;position:relative;font-weight:600;font-size:1.02rem;color:var(--ink)}
.sub-t::after{content:"";position:absolute;right:.4rem;top:50%;width:.45rem;height:.45rem;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.sub-acc.open .sub-t::after{transform:translateY(-30%) rotate(-135deg)}
.sub-t:hover{color:var(--part)}
.sub-b{display:none;padding:0 0 1rem}
.sub-acc.open .sub-b{display:block}
section.acc.gatebox .acc-t{color:var(--part)}
.acc-tools{display:flex;gap:.5rem;margin:0 0 1rem}
.acc-tools button{border:1px solid var(--line-2);background:none;border-radius:999px;padding:.3rem .8rem;font-size:.76rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.acc-tools button:hover{border-color:var(--ink);color:var(--ink)}
@media (max-width:640px){.acc-b{padding-left:0}}

/* ---------- bảng trên điện thoại: mỗi hàng một thẻ ---------- */
@media (max-width:640px){
  .tbl{border:0;overflow:visible;border-radius:0}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{border:1px solid var(--line);border-radius:var(--r);margin:0 0 .6rem;padding:.35rem 0 .5rem;background:var(--paper)}
  .tbl td{border:0;padding:.3rem .95rem;white-space:normal}
  .tbl td[data-label]::before{content:attr(data-label);display:block;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:.05rem}
  .tbl td[data-col="0"]{font-family:var(--serif);font-weight:500;font-size:1.08rem;padding-top:.5rem;background:none}
  .tbl td[data-col="0"]::before{display:none}
  .tbl tr[data-group]::before{content:attr(data-group);display:block;padding:.5rem .95rem 0;font-family:var(--serif);font-weight:500;font-size:1.08rem}
  .tbl td.num{white-space:normal}
  .prog .chip.lock{display:none}
}

/* ---------- lock, commit, quiz ---------- */
.gatebox{border-top:1px solid var(--line)}
.lockpanel{margin:3rem 0 0;padding:2rem 1.6rem;border:1px dashed var(--line-2);border-radius:var(--r);display:grid;gap:.6rem;background:var(--paper-2)}
.lockpanel b{font-family:var(--serif);font-weight:500;font-size:1.4rem}
.lockpanel p{margin:0;color:var(--ink-2)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:1.3rem 1.3rem 1.4rem;margin:0 0 1.4rem;background:var(--paper)}
.card h3{margin-top:0;color:var(--part)}
.field{display:grid;gap:.35rem;margin:0 0 .9rem}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.field input,.field select{padding:.7rem .85rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper)}
.tick{display:grid;grid-template-columns:1.4rem 1fr;gap:.5rem;padding:.4rem 0;font-size:.95rem;cursor:pointer}
.tick input{width:1.05rem;height:1.05rem;margin-top:.25rem;accent-color:var(--verm)}
.signed{display:flex;gap:.8rem;align-items:center;padding:.9rem 1.1rem;background:var(--ok-wash);color:var(--ok);border-radius:var(--r);font-weight:600;margin:0 0 1.4rem}
.signed span{color:var(--ink-2);font-weight:400}
.quiz-intro{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem 1rem;align-items:baseline;margin:0 0 1rem}
.quiz-intro p{margin:0;color:var(--ink-2);font-size:.95rem}
fieldset.q{border:1px solid var(--line);border-radius:var(--r);margin:0 0 .8rem;padding:1rem 1.1rem 1.1rem}
fieldset.q legend{padding:0 .3rem;margin-left:-.3rem;font-weight:600;line-height:1.45;float:left;width:100%;margin-bottom:.6rem}
fieldset.q legend .qn{color:var(--part);font-variant-numeric:tabular-nums;margin-right:.35rem}
.opt{display:grid;grid-template-columns:1.4rem 1fr;gap:.5rem;padding:.5rem .7rem;border-radius:var(--r);cursor:pointer;font-size:.96rem;line-height:1.45;clear:both}
.opt:hover{background:var(--paper-2)}
.opt input{margin-top:.25rem;accent-color:var(--part)}
.opt:has(input:checked){background:var(--part-wash)}
fieldset.q.wrong{border-color:var(--verm);background:color-mix(in srgb,var(--verm-wash) 50%,var(--paper))}
fieldset.q.right{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
fieldset.q.miss{border-color:var(--sun)}
.qfb{clear:both;font-size:.86rem;margin:.5rem 0 0;color:var(--verm)}
.qfb a{color:inherit;font-weight:600}
.quiz-actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem}
.quiz-actions .hint{font-size:.9rem;color:var(--verm)}
.result{border-radius:var(--r);padding:1.5rem 1.5rem 1.4rem;margin:0 0 1.4rem;display:grid;gap:.4rem}
.result.pass{background:var(--ok-wash)}
.result.fail{background:var(--verm-wash)}
.result .big{font-family:var(--serif);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.result .st{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.result.pass .st{color:var(--ok)} .result.fail .st{color:var(--verm)}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:.6rem 0 0;font-size:.92rem}
.result dt{color:var(--ink-2)} .result dd{margin:0;font-weight:600}
.result .shot{font-size:.88rem;color:var(--ink-2);margin:.4rem 0 0}
.best{font-size:.88rem;color:var(--ink-2)}

/* ---------- responsive ---------- */
/* ---------- sơ đồ: quy trình & mindmap ---------- */
.flow{list-style:none;padding:0!important;margin:1.2rem 0 1.4rem!important;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1.5rem;counter-reset:none}
.flow>li{position:relative;margin:0!important;padding:.75rem .8rem;border:1px solid var(--line-2);border-top:3px solid var(--part);border-radius:8px;background:var(--paper);box-shadow:0 1px 0 var(--line)}
.flow>li b{display:block;font-size:.93rem;line-height:1.35;color:var(--ink)}
.flow>li span{display:block;margin-top:.2rem;font-size:.84rem;line-height:1.4;color:var(--ink-2)}
.flow>li:not(:last-child)::after{content:"";position:absolute;right:-1.15rem;top:50%;width:.55rem;height:.55rem;border-right:2px solid var(--part);border-top:2px solid var(--part);transform:translateY(-50%) rotate(45deg)}
.flow>li.end{border-top-color:var(--verm);background:var(--verm-wash)}
.flow>li.end b{color:var(--verm)}
.mind{margin:1.3rem 0 1.5rem;display:grid;justify-items:center}
.mind-c{position:relative;padding:.65rem 1.4rem;border-radius:999px;background:var(--part);color:var(--paper);font-weight:700;text-align:center;font-size:1rem}
.mind-c::after{content:"";position:absolute;left:50%;bottom:-1rem;width:2px;height:1rem;background:var(--line-2)}
.mind-b{margin-top:1rem;width:100%;box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));column-gap:.7rem;row-gap:1.4rem;padding-top:1rem;border-top:2px solid var(--line-2)}
.mind-n{position:relative;padding:.65rem .75rem;border:1px solid var(--line-2);border-left:4px solid var(--part);border-radius:8px;background:var(--paper)}
.mind-n::before{content:"";position:absolute;left:50%;top:-1rem;width:2px;height:1rem;background:var(--line-2)}
.mind-n b{display:block;font-size:.93rem;line-height:1.35}
.mind-n span{display:block;margin-top:.15rem;font-size:.84rem;line-height:1.4;color:var(--ink-2)}
li .flow{margin:.7rem 0 .3rem!important}
@media (max-width:760px){
  .flow{grid-auto-flow:row;grid-auto-columns:auto;gap:1.3rem}
  .flow>li:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:-1rem;transform:translateX(-50%) rotate(135deg)}
  .mind-b{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){.mind-b{grid-template-columns:minmax(0,1fr)}}
/* ---------- tìm kiếm ---------- */
.find{position:relative;flex:1 1 18rem;max-width:30rem;margin-left:auto}
.find input{width:100%;box-sizing:border-box;padding:.55rem .9rem .55rem 2.2rem;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;font-size:.92rem}
.find input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sun-wash)}
.find::before{content:"";position:absolute;left:.85rem;top:50%;width:.7rem;height:.7rem;border:2px solid var(--ink-3);border-radius:50%;transform:translateY(-62%);pointer-events:none}
.find::after{content:"";position:absolute;left:1.55rem;top:58%;width:.4rem;height:2px;background:var(--ink-3);transform:rotate(45deg);pointer-events:none}
.find-res{position:absolute;left:0;right:0;top:calc(100% + .4rem);background:var(--paper);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:min(70vh,34rem);overflow:auto;z-index:40;padding:.35rem}
.find-res[hidden]{display:none}
.find-res button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:.6rem .7rem;border-radius:8px}
.find-res button:hover,.find-res button.on{background:var(--paper-2)}
.find-res .fr-t{display:block;font-size:.78rem;font-weight:700;color:var(--ink-3);margin-bottom:.15rem}
.find-res .fr-s{display:block;font-size:.92rem;line-height:1.5;color:var(--ink)}
.find-res mark{background:var(--sun-wash);color:inherit;border-radius:3px;padding:0 .1em;font-weight:600}
.find-res .fr-none{padding:.7rem;font-size:.9rem;color:var(--ink-2)}
.find-hit{animation:findhit 2.4s ease}
@keyframes findhit{0%,60%{background:var(--sun-wash);box-shadow:0 0 0 6px var(--sun-wash)}100%{background:transparent;box-shadow:none}}
.prog{margin-left:0}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top-in{flex-wrap:wrap}
  .find{order:5;flex:1 1 100%;max-width:none}
  .prog{order:4;flex:1 1 100%;min-width:0;justify-content:flex-start}
  .rail{position:fixed;inset:var(--toph,3.6rem) 0 0 0;max-height:none;background:var(--paper);z-index:15;padding:1.5rem 1.25rem 4rem;transform:translateX(-100%);transition:transform .25s ease;border-right:1px solid var(--line)}
  body.menu-open .rail{transform:none}
  .menu-btn{display:inline-block}
  .prog .chip:not(.key){display:none}
  main{max-width:none}
}
@media (max-width:640px){
  body{font-size:16px}
  .brand span{display:none}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.three,.compare{grid-template-columns:minmax(0,1fr)}
  .games{grid-template-columns:repeat(2,minmax(0,1fr))}
  .values{grid-template-columns:minmax(0,1fr)}
  .criteria{columns:1}
  .part-head{padding:2rem 1.2rem 1.6rem}
}
@media print{.top,.rail,.gate{display:none}.shell{display:block}main{max-width:none}}

/* ---------- dễ đọc tiếng Việt trên điện thoại ---------- */
body{line-height:1.7}
h3,h4,th,.msg-label,.rail h4,.quote cite,figure.saying figcaption,.welcome .lbl,.welcome figcaption,.gate label,.result .st,.part-no,.kicker,.lockpanel .part-no{text-transform:none!important;letter-spacing:0!important}
h3{font-size:1rem;color:var(--ink)}
h4{font-size:.94rem;color:var(--ink)}
th{font-size:.84rem}
.msg-label{font-size:.82rem!important}
.part-no,.kicker{font-size:.85rem!important}
.rail h4{font-size:.8rem}
.lede{font-family:var(--sans);font-size:1.06rem;line-height:1.7;color:var(--ink)}
.motto{font-family:var(--sans);font-style:normal;font-weight:500;font-size:1rem;line-height:1.65}
figure.saying .vi-line,.welcome .vi-line{font-family:var(--sans);font-size:1rem;font-weight:500}
.quote p{font-size:1.15rem}
@media (max-width:640px){body{font-size:16px}.intro h1{font-size:2rem}.part-title{font-size:1.75rem}.acc-t{font-size:1.12rem}}
.rule-box{margin:1.4rem 0;padding:1.1rem 1.2rem;border-radius:var(--r);background:var(--verm-wash);border-left:4px solid var(--verm)}
.rule-box .rule-t{margin:0 0 .4rem;font-weight:700;font-size:1.05rem;color:var(--verm)}
.rule-box p{margin:0 0 .6rem}
.rule-box ol{margin:0 0 .6rem;padding-left:1.2rem}
.rule-box .rule-n{margin:0;font-size:.92rem;color:var(--ink-2)}
.role-grid{display:grid;gap:.7rem;margin-top:.4rem}
.role-btn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:.15rem;padding:1rem 1.1rem;border:1px solid var(--line-2);border-radius:10px;background:var(--paper)}
.role-btn b{font-family:var(--serif);font-weight:500;font-size:1.3rem;color:var(--ink)}
.role-btn span{font-size:.92rem;color:var(--ink-2)}
.role-btn:hover,.role-btn:focus-visible{border-color:var(--verm);background:var(--verm-wash)}
.gate .link{border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:.88rem;padding:0}
.rail-foot{margin:1.6rem 0 0;padding-top:1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--ink-2)}
.rail-foot button{border:0;background:none;color:var(--verm);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.role-tag{display:inline-block;margin:0 0 .6rem;padding:.2rem .7rem;border-radius:999px;background:var(--moon-wash);color:var(--moon);font-size:.82rem;font-weight:600}
.onb{min-height:100vh;padding:2rem 1.1rem 4rem;background:radial-gradient(80% 50% at 10% 0%,var(--sun-wash),transparent 60%),var(--paper)}
.onb-card{width:min(42rem,100%);margin:0 auto;display:grid;gap:1rem}
.onb h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.15;margin:0}
.onb p{margin:0;color:var(--ink-2)}
.onb-step{font-size:.85rem;font-weight:600;color:var(--verm)!important}
.onb fieldset{border:1px solid var(--line);border-radius:10px;padding:1rem 1.05rem 1.1rem;margin:0;display:grid;gap:.8rem}
.onb legend{font-weight:700;padding:0 .35rem;margin-left:-.35rem}
.onb .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.onb label.f{display:grid;gap:.3rem;font-size:.9rem;font-weight:600;color:var(--ink)}
.onb label.f i{font-style:normal;color:var(--verm)}
.onb input[type=text],.onb input[type=email],.onb input[type=tel],.onb input[type=date],.onb select,.onb textarea{font:inherit;font-weight:400;width:100%;padding:.65rem .8rem;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);color:var(--ink)}
.onb textarea{min-height:4.2rem;resize:vertical}
.onb input:focus,.onb select:focus,.onb textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sun-wash)}
.onb input[type=file]{font-size:.88rem;font-weight:400}
.onb .roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.onb .roles label{display:grid;gap:.1rem;padding:.8rem .9rem;border:1px solid var(--line-2);border-radius:10px;cursor:pointer;font-weight:400}
.onb .roles label:has(input:checked){border-color:var(--verm);background:var(--verm-wash)}
.onb .roles b{font-size:1.05rem}
.onb .roles span{font-size:.85rem;color:var(--ink-2)}
.onb .roles input{position:absolute;opacity:0;pointer-events:none}
.onb .acts{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.onb .err{color:var(--verm);font-size:.9rem;min-height:1.3em}
.onb .hint{font-size:.85rem;color:var(--ink-3)}
.onb .tt{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;background:var(--paper);font-size:.95rem}
.onb .tt h1{font-size:1.25rem;text-align:center;margin:.2rem 0 .8rem}
.onb .tt h2{font-family:var(--sans);font-size:1rem;font-weight:700;margin:1rem 0 .3rem}
.onb .tt ul{margin:.2rem 0 .6rem;padding-left:1.1rem}
.onb .tt p{color:var(--ink)}
.onb .sig{border:1.5px dashed var(--line-2);border-radius:10px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.onb .link{border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:.88rem;padding:0}
@media (max-width:600px){.onb .g2,.onb .roles{grid-template-columns:minmax(0,1fr)}}
</style>

</head>

window.SM_TT={"gv":"\u003ch1>THỎA THUẬN LÀM VIỆC GIÁO VIÊN {{LOAIGV}}\u003c/h1>\n\u003cp>\u003cb>Bên A: SunMoon Art &amp; Education\u003c/b>\u003cbr>Địa chỉ: Park 01 &amp; Landmark 6, Vinhomes Central Park, 208 Nguyễn Hữu Cảnh, Bình Thạnh, TP.HCM\u003cbr>Đại diện: Leader SunMoon · Hotline: 039 630 8188 · 039 400 9488\u003c/p>\n\u003cp>\u003cb>Bên B: {{hoTen}}\u003c/b>\u003cbr>Ngày sinh: {{ngaySinh}} · Số CCCD: {{cccd}} (cấp {{cccdCap}})\u003cbr>Chỗ ở hiện tại: {{choO}}\u003cbr>Điện thoại: {{sdt}} · Email: {{email}}\u003c/p>\n\u003ch2>1. Vị trí &amp; thời gian\u003c/h2>\n\u003cul>\n\u003cli>Vị trí: \u003cb>Giáo viên {{loaiGV}}\u003c/b>. Lớp và lịch dạy theo phân công của bộ phận học vụ.\u003c/li>\n\u003cli>Ngày bắt đầu: ngày ký. Thời hạn: 12 tháng, hết hạn hai bên không có ý kiến khác thì tự gia hạn.\u003c/li>\n\u003cli>Mỗi ca dạy 1,5 tiếng. Có mặt trước giờ dạy 15 phút.\u003c/li>\n\u003c/ul>\n\u003ch2>2. Việc phải làm\u003c/h2>\n\u003cul>\n\u003cli>Dạy theo bài giảng PPT giáo trình của trung tâm, không tự ý đổi nội dung, đổi lịch.\u003c/li>\n\u003cli>Theo dõi năng lực từng học viên, tạo không khí lớp vui vẻ, giữ an toàn cho các bé.\u003c/li>\n\u003cli>Cuối giờ: điểm danh trên hệ thống, viết nhận xét chi tiết từng bé gửi trong ngày.\u003c/li>\n\u003cli>Soạn giáo án theo yêu cầu. Lớp người lớn tự soạn PPT và gửi lại trung tâm.\u003c/li>\n\u003cli>Giữ gìn vệ sinh chung: không để học viên vẽ bậy lên đồ dùng, bàn, tường; học xong nhắc lớp thu dọn đồ.\u003c/li>\n\u003cli>Mỗi tháng dạy \u003cb>4 lớp trải nghiệm\u003c/b> (học thử) cho trung tâm, \u003cb>không tính lương\u003c/b>.\u003c/li>\n\u003c/ul>\u003ch2>3. Thù lao\u003c/h2>\n\u003cul>\n\u003cli data-loai=\"pt\">Lương: \u003cb>120.000đ/buổi\u003c/b> (ca 1,5 tiếng), tính theo số buổi dạy thực tế trên Lịch toàn năng.\u003c/li>\n\u003cli data-loai=\"ft\">Lương: theo thông báo riêng của trung tâm.\u003c/li>\n\u003cli>Thời gian thử việc và ngày trả: theo thông báo riêng của trung tâm.\u003c/li>\n\u003cli>Đồng phục: trung tâm phát áo, cọc 150.000đ/áo, hoàn cọc khi trả áo.\u003c/li>\n\u003c/ul>\n\u003ch2>4. Quy tắc bắt buộc\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Cẩm nang Giáo viên SunMoon là một phần của thỏa thuận này.\u003c/b> Bên B đọc kỹ và cam kết làm theo.\u003c/li>\n\u003cli>Bảo mật thông tin học viên, phụ huynh, giáo trình, học liệu, cả trong và sau thời gian làm việc.\u003c/li>\n\u003cli>Không lôi kéo học viên của trung tâm để dạy riêng hoặc giới thiệu sang nơi khác, trong thời gian làm việc và 12 tháng sau khi nghỉ.\u003c/li>\n\u003cli>Làm việc cho trung tâm, doanh nghiệp khác phải báo Bên A trước.\u003c/li>\n\u003cli>Đặt an toàn của các bé lên trên hết; không liên lạc riêng với học viên nhỏ tuổi.\u003c/li>\n\u003c/ul>\n\u003ch2>5. Vi phạm &amp; chấm dứt\u003c/h2>\n\u003cul>\n\u003cli>Vi phạm xử lý theo mục 2.5 Cẩm nang: nhắc riêng → nhắc bằng văn bản → tạm ngưng xếp lớp.\u003c/li>\n\u003cli>Vi phạm vạch đỏ: Bên A chấm dứt thỏa thuận ngay.\u003c/li>\n\u003cli>Muốn nghỉ: báo trước 15 ngày khi đang thử việc, 30 ngày khi đã chính thức; dạy bình thường trong thời gian báo trước, bàn giao đủ lớp, học liệu, đồng phục.\u003c/li>\n\u003c/ul>\n\u003ch2>6. Xác nhận\u003c/h2>\n\u003cul>\n\u003cli>Bên B ký xác nhận online: tích đồng ý, gõ họ tên, vẽ chữ ký. Hệ thống ghi thời điểm ký.\u003c/li>\n\u003cli>Bản PDF đã ký gửi email cho Bên B. Thỏa thuận có hiệu lực từ ngày ký.\u003c/li>\n\u003c/ul>","tg":"\u003ch1>THỎA THUẬN LÀM VIỆC TRỢ GIẢNG\u003c/h1>\n\u003cp>\u003cb>Bên A: SunMoon Art &amp; Education\u003c/b>\u003cbr>Địa chỉ: Park 01 &amp; Landmark 6, Vinhomes Central Park, 208 Nguyễn Hữu Cảnh, Bình Thạnh, TP.HCM\u003cbr>Đại diện: Leader SunMoon · Hotline: 039 630 8188 · 039 400 9488\u003c/p>\n\u003cp>\u003cb>Bên B: {{hoTen}}\u003c/b>\u003cbr>Ngày sinh: {{ngaySinh}} · Số CCCD: {{cccd}} (cấp {{cccdCap}})\u003cbr>Chỗ ở hiện tại: {{choO}}\u003cbr>Điện thoại: {{sdt}} · Email: {{email}}\u003c/p>\n\u003ch2>1. Vị trí &amp; thời gian\u003c/h2>\n\u003cul>\n\u003cli>Vị trí: \u003cb>Trợ giảng\u003c/b>. Lớp và lịch dạy theo phân công của bộ phận học vụ.\u003c/li>\n\u003cli>Ngày bắt đầu: ngày ký. Thời hạn: 12 tháng, hết hạn hai bên không có ý kiến khác thì tự gia hạn.\u003c/li>\n\u003cli>Mỗi ca dạy 1,5 tiếng. Đến sớm để chuẩn bị, có mặt ở sảnh đón bé trước 5 phút.\u003c/li>\n\u003c/ul>\n\u003ch2>2. Việc phải làm\u003c/h2>\n\u003cul>\n\u003cli>Chuẩn bị bài in, học liệu, bánh nước; kiểm tra phòng học, bật điều hòa trước 5–10 phút.\u003c/li>\n\u003cli>Nhắn riêng từng phụ huynh trước buổi học; đón và đếm bé ở sảnh.\u003c/li>\n\u003cli>Theo dõi, kèm bé theo chậm; kèm bù 1 kèm 1 khi được phân công; quay chụp đúng quy định.\u003c/li>\n\u003cli>Cuối giờ: nhắn riêng từng phụ huynh nội dung buổi học, nhận xét, ảnh và video; trả bé tận tay phụ huynh.\u003c/li>\n\u003cli>Dọn vệ sinh, tắt thiết bị, xếp lớp và học liệu đúng chỗ.\u003c/li>\n\u003c/ul>\u003ch2>3. Thù lao\u003c/h2>\n\u003cul>\n\u003cli>Lương: \u003cb>3.500.000đ / 144 giờ\u003c/b> (khoảng 24.300đ/giờ), tính theo số giờ chấm công thực tế trên Lịch toàn năng.\u003c/li>\n\u003cli>Thời gian thử việc và ngày trả: theo thông báo riêng của trung tâm.\u003c/li>\n\u003cli>Đồng phục: trung tâm phát áo, cọc 150.000đ/áo, hoàn cọc khi trả áo.\u003c/li>\n\u003c/ul>\n\u003ch2>4. Quy tắc bắt buộc\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Cẩm nang Trợ giảng SunMoon là một phần của thỏa thuận này.\u003c/b> Bên B đọc kỹ và cam kết làm theo.\u003c/li>\n\u003cli>Tiền học phí, tiền tài liệu phụ huynh gửi: giao ngay cho quản lý, không giữ lại.\u003c/li>\n\u003cli>Bảo mật thông tin học viên, phụ huynh, giáo trình, học liệu, cả trong và sau thời gian làm việc.\u003c/li>\n\u003cli>Không lôi kéo học viên của trung tâm để dạy riêng hoặc giới thiệu sang nơi khác, trong thời gian làm việc và 12 tháng sau khi nghỉ.\u003c/li>\n\u003cli>Làm việc cho trung tâm, doanh nghiệp khác phải báo Bên A trước.\u003c/li>\n\u003cli>Đặt an toàn của các bé lên trên hết; không liên lạc riêng với học viên nhỏ tuổi.\u003c/li>\n\u003c/ul>\n\u003ch2>5. Vi phạm &amp; chấm dứt\u003c/h2>\n\u003cul>\n\u003cli>Vi phạm xử lý theo mục 2.5 Cẩm nang: nhắc riêng → nhắc bằng văn bản → tạm ngưng xếp lớp.\u003c/li>\n\u003cli>Vi phạm vạch đỏ: Bên A chấm dứt thỏa thuận ngay.\u003c/li>\n\u003cli>Muốn nghỉ: báo trước 15 ngày khi đang thử việc, 30 ngày khi đã chính thức; dạy bình thường trong thời gian báo trước, bàn giao đủ lớp, học liệu, đồng phục.\u003c/li>\n\u003c/ul>\n\u003ch2>6. Xác nhận\u003c/h2>\n\u003cul>\n\u003cli>Bên B ký xác nhận online: tích đồng ý, gõ họ tên, vẽ chữ ký. Hệ thống ghi thời điểm ký.\u003c/li>\n\u003cli>Bản PDF đã ký gửi email cho Bên B. Thỏa thuận có hiệu lực từ ngày ký.\u003c/li>\n\u003c/ul>","ql":"\u003ch1>THỎA THUẬN LÀM VIỆC QUẢN LÝ\u003c/h1>\n\u003cp>\u003cb>Bên A: SunMoon Art &amp; Education\u003c/b>\u003cbr>Địa chỉ: Park 01 &amp; Landmark 6, Vinhomes Central Park, 208 Nguyễn Hữu Cảnh, Bình Thạnh, TP.HCM\u003cbr>Đại diện: Leader SunMoon · Hotline: 039 630 8188 · 039 400 9488\u003c/p>\n\u003cp>\u003cb>Bên B: {{hoTen}}\u003c/b>\u003cbr>Ngày sinh: {{ngaySinh}} · Số CCCD: {{cccd}} (cấp {{cccdCap}})\u003cbr>Chỗ ở hiện tại: {{choO}}\u003cbr>Điện thoại: {{sdt}} · Email: {{email}}\u003c/p>\n\u003ch2>1. Vị trí &amp; thời gian\u003c/h2>\n\u003cul>\n\u003cli>Vị trí: \u003cb>Quản lý\u003c/b>. Cơ sở phụ trách và giờ làm theo phân công của Bên A.\u003c/li>\n\u003cli>Ngày bắt đầu: ngày ký. Thời hạn: 12 tháng, hết hạn hai bên không có ý kiến khác thì tự gia hạn.\u003c/li>\n\u003cli>Có mặt trước ca học đầu tiên của cơ sở để kiểm tra lớp, người dạy, phòng học.\u003c/li>\n\u003c/ul>\n\u003ch2>2. Việc phải làm\u003c/h2>\n\u003cul>\n\u003cli>Điều hành cơ sở hằng ngày: lịch lớp, người dạy thay, phòng học, thiết bị, học liệu, bánh nước.\u003c/li>\n\u003cli>Hướng dẫn, theo dõi giáo viên, trợ giảng làm đúng Cẩm nang; nhắc nhở và ghi nhận vi phạm theo mục 2.5.\u003c/li>\n\u003cli>Duyệt báo nghỉ, đổi lịch, dạy bù; chỉ trung tâm báo phụ huynh, nhắn riêng từng phụ huynh.\u003c/li>\n\u003cli>Nhận ngay tiền học phí, tiền tài liệu nhân viên nộp; ghi lại và báo Bên A trong ngày.\u003c/li>\n\u003cli>Xử lý sự cố, phản ánh của phụ huynh; báo Bên A ngay việc nghiêm trọng và mọi vi phạm vạch đỏ.\u003c/li>\n\u003cli>Theo dõi chấm công trên Lịch toàn năng; chỉ sửa giờ theo giờ thật và ghi lý do.\u003c/li>\n\u003c/ul>\n\u003ch2>3. Thù lao\u003c/h2>\n\u003cul>\n\u003cli>Mức thù lao, thời gian thử việc và ngày trả: theo thông báo riêng của trung tâm cho từng vị trí.\u003c/li>\n\u003cli>Đồng phục: trung tâm phát áo, cọc 150.000đ/áo, hoàn cọc khi trả áo.\u003c/li>\n\u003c/ul>\n\u003ch2>4. Quy tắc bắt buộc\u003c/h2>\n\u003cul>\n\u003cli>\u003cb>Cẩm nang SunMoon (gồm mục Quản lý) là một phần của thỏa thuận này.\u003c/b> Bên B đọc kỹ và cam kết làm theo.\u003c/li>\n\u003cli>Tiền học phí, tiền tài liệu nhận từ nhân viên hoặc phụ huynh: ghi đủ, báo và giao Bên A đúng hạn, không giữ lại, không dùng riêng.\u003c/li>\n\u003cli>Không xem, không sao chép hồ sơ cá nhân của nhân viên; hồ sơ chỉ Bên A quản lý.\u003c/li>\n\u003cli>Bảo mật thông tin học viên, phụ huynh, nhân viên, giáo trình, học phí, kinh doanh của trung tâm, cả trong và sau thời gian làm việc.\u003c/li>\n\u003cli>Không lôi kéo học viên, nhân viên của trung tâm sang nơi khác, trong thời gian làm việc và 12 tháng sau khi nghỉ.\u003c/li>\n\u003cli>Không đưa mã quản lý cho người khác. Làm việc cho trung tâm, doanh nghiệp khác phải báo Bên A trước.\u003c/li>\n\u003cli>Đặt an toàn của các bé lên trên hết.\u003c/li>\n\u003c/ul>\n\u003ch2>5. Vi phạm &amp; chấm dứt\u003c/h2>\n\u003cul>\n\u003cli>Vi phạm xử lý theo mục 2.5 Cẩm nang: nhắc riêng → nhắc bằng văn bản → trao đổi lại việc tiếp tục hợp tác.\u003c/li>\n\u003cli>Vi phạm vạch đỏ: Bên A chấm dứt thỏa thuận ngay.\u003c/li>\n\u003cli>Muốn nghỉ: báo trước 15 ngày khi đang thử việc, 30 ngày khi đã chính thức; làm việc bình thường trong thời gian báo trước, bàn giao đủ công việc, tiền, chìa khóa, tài liệu, đồng phục.\u003c/li>\n\u003c/ul>\n\u003ch2>6. Xác nhận\u003c/h2>\n\u003cul>\n\u003cli>Bên B ký xác nhận online: tích đồng ý, gõ họ tên, vẽ chữ ký. Hệ thống ghi thời điểm ký.\u003c/li>\n\u003cli>Bản PDF đã ký gửi email cho Bên B. Thỏa thuận có hiệu lực từ ngày ký. Mã quản lý được gửi sau khi Bên A duyệt hồ sơ.\u003c/li>\n\u003c/ul>"};window.SM_ENC={"s":"rprTtQ8g/ujY/5wubHwP+g==","i":"VlKMjg4QhQDpB1zN","n":250000,"d":"p+9xmdAhGt/kD7uezR6AJAXEH82+wPS+KcTnLwszQLwu/oYB+E4WvaRYEGm5+1fsBL5iVMoLTPNxZeGg9gldfj//hzCyf1+fFhu1qFG5w2Tlgo/qBTkAmbs85r8rvnqU29K9vbNcxy5QBYQDShKHZxQFUJctlb+XNHGKBfAj/1jr72nbZVuFrKY4QNFKgLxGgL/l3icaE/b1MYmyWPoAU94XTFhOC3WwH42ia/SL8r364BL/xq6P/00QXTypYLuwY5dy/hiRc2lLM+pylSbUdSi/C7urhmrzqh5VJnCe6bPaeDO6GkaOMtyOP2yHrQyIi5E3eLm2LiYkqAy2mzY1oxPfrdgA71yWRESX7V/0or0G9+xC7mtnz21hjJscClE4c/ebxJ66WBVJ2p469W9S7X3+xG1EUqPS5wHJwf9/TuK9eUTTfW06ZC139cNR3lRXO3gHJjMVQKYpKa5vLhdmtdjKIEioA4QzFFtk/PqV4i8+A189Z6Sni5Xb2yc8L718kXu7LvFXmoVAPlyJFIzWN2cAtoc65nW5dqMfzQyIIWFNnmQ5Gxb/6OKAZCPkDDJB8Pr8N6Wl9r/xiJQI7t2lSVMOfnEDPDJhW62AYA1tmQ6yYpPlSGe8BAwLFFvf8nSGt0GNyrdxo034oIDJ5IA2t9O2JMl0Dyd8uX+kxslC0r97XHNTKEUjYxfZkUDk2WSUUayojvg7J7IUP71EO6ey7wwit5V4V3z/lt5SQFQWfxiK8zxwZqmEfFCv3+mBKAII90czPp9gapv+Mo9kD2PYyxfUGV+IoK1VjPUpE8PxhyuOKFNDcx5Dmy94RRfEuNygO8i8xz3B0iiRwJpoBXfAgwiASn4/C6KTSdztYwPNudsvR1b7/mXFx8Ce4V5hJM82NSZoiRBL6/vLyHMaGtkqABP2vkmzixPJ+wOatiTMtAeWEGYLOwB68SVrHfWBFaC4Is600KMeeoipS4ygXXMTryatrqDpVz56i21tJzuZveCgaV7iwnMoxMR/DomjBYxlZibZm2kINEo9hPVUDcpxVOCn+q5l4rqFRlnBjKh3kcFbh3DmQMCTGBfXvzGi9XRUHWMR1Zot9G6RYd9VdfYhKC8RntxHRHZLZjFFd+9cprcPsGv7jgOqKvp1l315PVX5dbA7LSjEdWfIkVnmODpDxmFTpX7Gts8eq4XZGJiwM53ntjIih/Dzjqxk6izTL7geCBAurcOv1IDNeIhckDX9C+HfuCUrOVCHiMWtWXDrG96S0RgXWfy9qFqaCAzek1n7RxZYlNffP7xBT7frVDapI/jxgWofJSnsBBFW5FBdg4TR2yPHdEjtC6Xu7MkkNTx37HCbc5tNCSQaFKyUk/Az+DKMDtw4PIVyqdbVhjt2PmGDGSnMxj11N9//M4nyUI9TZCwdSsW0XCYsAF71ythm93YF6ByZmqSnNvtLGCCux1Ij6yWctBF5CEyAknypoZsCcorJv6TveFiPiO+AoiGWD6Zk+f9RXnLYKDbGu4+P4dw7qEN9OlKdH9g4JGOfk7pEmohunAD2EPcmOXs3OhrH39X390KlvjNlez1mFlMCsAcIhqcIX1H7r0rSMnTOckDsK7IlzfolRnq9Wff2HvpszCMANMHtodj49hjDxWHz9NZQxkkcMZ1ZU8tPjhZuY9tmsIKX7gr9+PhEV5RX3HKZjTzVE8bwIdD42L+h var KEY='sm_cn_v1', SKEY='sm_cn_code', QKEY='sm_cn_ql';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
var S=load();
var DATA=null;

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,'')}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

function decrypt(code,E){
  E=E||window.SM_ENC;var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(norm(code)),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},k,b64(E.d))})
    .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}

/* mã nhân viên mở SM_ENC; mã quản lý mở SM_QL, trong đó có mã nhân viên + mục Quản lý */
function unlock(code){
  return decrypt(code).catch(function(e){
    if(!window.SM_QL)throw e;
    return qlOpen(code);
  });
}
function qlOpen(k){return decrypt(k,window.SM_QL).catch(function(e){if(!window.SM_QLT)throw e;return decrypt(k,window.SM_QLT)}).then(function(q){if(q.het&&Date.now()>q.het){try{localStorage.removeItem(QKEY)}catch(e){}throw new Error('het')}return decrypt(q.k).then(function(d){d.ql=q.html;return d})})}

function api(qs,cb){
  if(!HS_URL){cb(null);return}

function vaoBangKhoa(r){
  if(r.role==='ql'){
    return qlOpen(r.key).then(function(d){try{localStorage.setItem(QKEY,JSON.stringify({k:r.key,email:r.email||''}))}catch(e){}return d});
  }
  return decrypt(r.key).then(function(d){
    S.hs={email:r.email,role:r.role,name:r.name||'',so:r.so||''};S.k=r.key;S.role=r.role;save(S);
    try{sessionStorage.setItem(SKEY,r.key)}catch(e){}
    return d;
  });
}
function login(msg){
  $('#gate').hidden=true;$('#app').hidden=true;
  var box=$('#onboard'),body=$('#onb-body');box.hidden=false;$('#onb-step').textContent='Đăng nhập';
  var cho=S.hs&&S.hs.role==='ql'&&!msg;
  body.innerHTML=(cho?'<h1>Chờ trung tâm duyệt hồ sơ</h1><p>Hồ sơ và thỏa thuận quản lý của bạn đã gửi về trung tâm'+(S.hs.so?' (số <b>'+esc(S.hs.so)+'</b>)':'')+'. Trung tâm duyệt xong, <b>mã đăng nhập tự gửi về email</b> của bạn.</p>':
      '<h1>Đăng nhập cẩm nang</h1><p>'+(msg?esc(msg)+' ':'')+'Nhập email đã khai trong hồ sơ và <b>mã đăng nhập 4 số</b> của bạn. Mã này dùng chung cho Cẩm nang và Lịch toàn năng.</p>')+
    '<label class="f"><span>Email</span><input type="email" id="l-email" autocomplete="email" value="'+esc(S.hs&&S.hs.email&&S.hs.email!=='xem-truoc'?S.hs.email:'')+'"></label>'+
    '<label class="f"><span>Mã đăng nhập</span><input type="password" id="l-ma" inputmode="numeric" autocomplete="current-password" autocapitalize="off" spellcheck="false"></label>'+
    '<p class="err" id="l-err"></p>'+
    '<div class="acts"><button class="btn" type="button" id="l-ok">Vào cẩm nang</button><button class="btn ghost" type="button" id="l-new">Khai hồ sơ mới</button></div>'+
    '<p class="hint"><button class="link" type="button" id="l-resend">Quên mã hoặc chưa nhận mã? Gửi mã về email</button></p>'+
    '<p class="hint">Quản trị: để trống email, nhập mã quản trị.</p>';
  var em=$('#l-email'),ma=$('#l-ma'),er=$('#l-err');(em.value?ma:em).focus();
  $('#l-new').onclick=function(){delete S.hs;save(S);box.hidden=true;onboard(null)};
  function xong(d){box.hidden=true;enter(d)}
  function go(){
    var e1=em.value.trim().toLowerCase(),m1=ma.value.trim();
    if(!m1){er.textContent='Nhập mã đăng nhập.';return}
    if(e1&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e1)){er.textContent='Email chưa đúng định dạng.';return}
    er.textContent='Đang kiểm tra…';
    function mayChu(){
      api('login='+encodeURIComponent(e1)+'&ma='+encodeURIComponent(m1),function(r){
        if(!r){er.textContent='Chưa kết nối được hệ thống. Kiểm tra mạng rồi thử lại.';return}
        if(!r.ok){er.textContent=r.error||'Sai email hoặc mã.';return}
        r.email=e1;vaoBangKhoa(r).then(xong,function(){er.textContent='Không mở được cẩm nang. Nhắn trung tâm giúp.'});
      });
    }
    if(!e1){qlOpen(norm(m1)).then(function(d){try{localStorage.setItem(QKEY,JSON.stringify({k:norm(m1)}))}catch(x){}xong(d)},function(x){if(x&&x.message==='het'){er.textContent='Mã quản lý tạm đã hết hạn. Đăng nhập bằng email và mã 4 số của bạn.';return}mayChu()});return}
    mayChu();
  }

    var e1=em.value.trim().toLowerCase();

    er.textContent='Đang gửi…';
    api('resend='+encodeURIComponent(e1),function(r){
      if(!r){er.textContent='Chưa kết nối được hệ thống. Kiểm tra mạng rồi thử lại.';return}
      er.textContent=r.sent?'Đã gửi mã về '+e1+'. Xem hộp thư, cả mục Spam.':(r.error||'Chưa gửi được mã.');
    });
  };
}
var qlLogin=function(){login()};
function boot(){
  if(window.SM_PLAIN){enter(window.SM_PLAIN);return}
  var qk=null;try{qk=JSON.parse(localStorage.getItem(QKEY))}catch(e){}
  if(qk&&qk.k){qlOpen(qk.k).then(enter,function(){try{localStorage.removeItem(QKEY)}catch(e){}boot()});return}
  var saved=null;try{saved=sessionStorage.getItem(SKEY)}catch(e){}
  saved=saved||S.k;
  if(saved){unlock(saved).then(enter,function(){delete S.k;save(S);noKey()})}else noKey();
}
function noKey(){
  if(S.hs&&S.hs.email&&S.hs.email!=='xem-truoc'){login(S.hs.role==='ql'?'':'Phiên đăng nhập đã hết.');return}
  onboard(null);
}
function showGate(){
  $('#gate').hidden=false;
  var f=$('#gate-form'),msg=$('#gate-msg'),inp=$('#code');
  $('#gate-ql').onclick=qlLogin;
  $('#gate-new').onclick=function(){$('#gate').hidden=true;onboard(null)};
  inp.focus();
  f.addEventListener('submit',function(e){
    e.preventDefault();msg.textContent='Đang mở…';
    unlock(inp.value).then(function(d){
      try{sessionStorage.setItem(SKEY,norm(inp.value))}catch(e){}
      if(!d.ql){S.k=norm(inp.value);save(S)}
      $('#gate').hidden=true;enter(d);
    },function(){msg.textContent='Mã chưa đúng. Kiểm tra lại hoặc hỏi quản lý để lấy mã.';inp.select()});
  });
}

var TC_GIU=['các bạn','kết bạn','Kết bạn','bạn bè','như bạn','bạn kia','bạn nào','cùng bạn','giúp bạn','được bạn','bằng bạn','bị bạn','bạn khác','một bạn','bạn Bi','bạn trợ giảng','Bạn đang trong ca'];
function tc(t){
  if(!t||!/[Bb]ạn/.test(t))return t;
  var g=[];TC_GIU.forEach(function(k){t=t.split(k).join('\u0001'+(g.push(k)-1)+'\u0002')});
  t=t.replace(/(^|[^\p{L}])Bạn(?![\p{L}])/gu,'$1Thầy/cô').replace(/(^|[^\p{L}])bạn(?![\p{L}])/gu,'$1thầy/cô');
  return t.replace(/\u0001(\d+)\u0002/g,function(_,i){return g[+i]});
}
function tcDoc(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n;
  while((n=w.nextNode())){var v=tc(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
  $$('input[placeholder]',root).forEach(function(i){i.placeholder=tc(i.placeholder)});
}
function tcQuiz(Q){Q.q.forEach(function(x){x[0]=tc(x[0]);x[1]=x[1].map(tc)})}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function renderQuiz(p,result){
  var m=$('.quiz-mount[data-quiz="'+p+'"]');if(!m)return;
  var Q=DATA.quiz[p],tot=Q.q.length,r=S[p]||{};
  if(p==='A'&&!S.sign){m.innerHTML='<p class="note">Ký bản cam kết ở trên để bắt đầu bài kiểm tra.</p>';return}

  h+='<form id="qf-'+p+'">';
  Q.q.forEach(function(q,i){
    var opts=shuffle(q[1].map(function(t,k){return {t:t,k:k}}));
    h+='<fieldset class="q" data-i="'+i+'"><legend><span class="qn">'+(i+1)+'.</span>'+esc(q[0])+'</legend>';
    opts.forEach(function(o){h+='<label class="opt"><input type="radio" name="'+p+'q'+i+'" value="'+o.k+'"><span>'+esc(o.t)+'</span></label>'});
    h+='</fieldset>';
  });
  h+='<div class="quiz-actions"><button class="btn" type="submit">Nộp bài</button><span class="hint" id="hint-'+p+'" role="status"></span></div></form>';
  m.innerHTML=h;
  $('#qf-'+p).addEventListener('submit',function(e){e.preventDefault();grade(p)});
  var more=$('.goto-b',m);if(more)more.addEventListener('click',function(){var b=document.getElementById('phan-b');if(b)b.scrollIntoView()});
}
function grade(p){
  var Q=DATA.quiz[p],f=$('#qf-'+p),miss=[],score=0,wrong=[];
  $$('fieldset.q',f).forEach(function(fs){fs.classList.remove('wrong','right','miss');var old=$('.qfb',fs);if(old)old.remove()});
  Q.q.forEach(function(q,i){var c=$('input[name="'+p+'q'+i+'"]:checked',f);if(!c)miss.push(i)});
  if(miss.length){
    miss.forEach(function(i){$('fieldset[data-i="'+i+'"]',f).classList.add('miss')});
    $('#hint-'+p).textContent='Còn '+miss.length+' câu chưa chọn đáp án (viền vàng).';
    $('fieldset[data-i="'+miss[0]+'"]',f).scrollIntoView({block:'center'});return;
  }
  Q.q.forEach(function(q,i){var c=$('input[name="'+p+'q'+i+'"]:checked',f);if(c.value==='0')score++;else wrong.push(i)});
  var ok=score>=Q.pass,r=S[p]||{};
  r.best=Math.max(r.best||0,score);r.passed=!!(r.passed||ok);r.last=score;r.tries=(r.tries||0)+1;r.at=stamp();
  if(ok&&!r.passAt)r.passAt=r.at;
  S[p]=r;save(S);
  var res={score:score,ok:ok,wrong:wrong,at:r.at,tries:r.tries};
  renderQuiz(p,res);
  var m=$('.quiz-mount[data-quiz="'+p+'"]');
  // mark wrong answers on the fresh form? Keep feedback in result card instead, then scroll to it.
  var sq=m.closest('section.acc');if(sq)setOpen(sq,true);m.scrollIntoView({block:'start'});
  if(p==='A'){applyLock();renderQuiz('B')}
  progress();
}

/* ---------- nhãn cột cho bảng (dùng khi xem trên điện thoại) ---------- */
function labelTables(doc){
  $$('.tbl table',doc).forEach(function(tb){
    var heads=$$('thead th',tb).map(function(th){return th.textContent.trim()});
    var n=heads.length,left=[],txt=[];
    $$('tbody tr',tb).forEach(function(tr){
      var col=0;
      $$(':scope > td',tr).forEach(function(td){
        while(col<n&&left[col]>0){if(col===0)tr.setAttribute('data-group',txt[0]);left[col]--;col++}
        td.setAttribute('data-col',col);
        if(heads[col])td.setAttribute('data-label',heads[col]);
        var rs=parseInt(td.getAttribute('rowspan')||'1',10),cs=parseInt(td.getAttribute('colspan')||'1',10);
        if(rs>1){left[col]=rs-1;var tmp=document.createElement('div');tmp.innerHTML=td.innerHTML.replace(/<br\s*\/?>/gi,' · ');txt[col]=tmp.textContent.replace(/\s+/g,' ').trim()}
        col+=cs;
      });
      while(col<n){if(left[col]>0){if(col===0)tr.setAttribute('data-group',txt[0]);left[col]--}col++}
    });
  });
}

function accordion(doc){
  $$('section[data-part]',doc).forEach(function(sec){
    if(sec.id==='mo-dau')return;
    var h=$(':scope > h2',sec);if(!h)return;
    var body=document.createElement('div');body.className='acc-b';body.id=sec.id+'-b';
    while(h.nextSibling)body.appendChild(h.nextSibling);
    var btn=document.createElement('button');btn.type='button';btn.className='acc-t';
    btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls',body.id);
    while(h.firstChild)btn.appendChild(h.firstChild);
    h.appendChild(btn);sec.appendChild(body);sec.classList.add('acc');
    btn.addEventListener('click',function(){setOpen(sec,!sec.classList.contains('open'))});
    if(sec.getAttribute('data-part')==='Q'){
      $$(':scope > h3',body).forEach(function(h3){
        var box=document.createElement('div');box.className='sub-acc';
        var b=document.createElement('button');b.type='button';b.className='sub-t';b.setAttribute('aria-expanded','false');
        while(h3.firstChild)b.appendChild(h3.firstChild);
        var sb=document.createElement('div');sb.className='sub-b';
        while(h3.nextSibling&&!(h3.nextSibling.nodeType===1&&h3.nextSibling.tagName==='H3'))sb.appendChild(h3.nextSibling);
        h3.parentNode.insertBefore(box,h3);h3.remove();box.appendChild(b);box.appendChild(sb);
        b.addEventListener('click',function(){var o=!box.classList.contains('open');box.classList.toggle('open',o);b.setAttribute('aria-expanded',o)});
      });
    }
  });
  $$('.part-head',doc).forEach(function(ph){
    var part=ph.getAttribute('data-part');
    var tools=document.createElement('div');tools.className='acc-tools';tools.setAttribute('data-part',part);
    tools.innerHTML='<button type="button" data-a="1">Mở tất cả</button><button type="button" data-a="0">Thu gọn</button>';
    tools.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
      var on=b.getAttribute('data-a')==='1',n=ph.nextElementSibling;
      while(n&&!n.classList.contains('part-head')){if(n.classList.contains('acc')){setOpen(n,on);$$('.sub-acc',n).forEach(function(s){s.classList.toggle('open',on)})}n=n.nextElementSibling}});
    ph.parentNode.insertBefore(tools,ph.nextSibling);
  });
  function openFromHash(h){
    var id=(h||'').replace(/^#/,'');if(!id)return;
    var el=document.getElementById(id);if(!el)return;
    if(el.hidden||el.offsetParent===null){var lp=document.getElementById('lockpanel');if(lp)el=lp}
    var sec=el.closest('section.acc');if(sec)setOpen(sec,true);
    var sa=el.closest('.sub-acc');if(sa)sa.classList.add('open');
    setTimeout(function(){el.scrollIntoView()},30);
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="#"]');if(!a)return;
    var id=a.getAttribute('href');if(id.length<2)return;
    var el=document.getElementById(id.slice(1));if(!el)return;
    e.preventDefault();history.replaceState(null,'',id);openFromHash(id);
  });
  window.addEventListener('hashchange',function(){openFromHash(location.hash)});
  window.__openFromHash=openFromHash;
}
function setOpen(sec,on){sec.classList.toggle('open',on);var b=$('.acc-t',sec);if(b)b.setAttribute('aria-expanded',on?'true':'false')}

/* ---------- tìm kiếm: gõ từ hoặc cụm từ → gợi ý đoạn trả lời ---------- */
function bo(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function finder(){
  var inp=$('#find-q'),box=$('#find-res'),top=$('.top'),IDX=null,sel=-1,hits=[];
  function toph(){document.documentElement.style.setProperty('--toph',top.offsetHeight+'px')}
  toph();window.addEventListener('resize',toph);
  function build(){
    IDX=[];
    var doc=$('#doc'),seen=[];
    $$('p,li,tr,h3,h4,details.case,blockquote,figure.saying',doc).forEach(function(el){
      if(el.closest('[hidden],.welcome,.quiz-mount,.commit-mount,.acc-tools,thead,#cau-ran,#lockpanel'))return;
      if(el.closest('details.case')&&el.tagName!=='DETAILS')return;
      if(el.tagName==='P'&&el.closest('li,td,blockquote,figure'))return;
      if(el.tagName==='LI'&&el.querySelector('li'))return;
      var t=(el.tagName==='TR'?$$('td,th',el).map(function(c){return c.textContent.trim()}).join(' — '):el.textContent).replace(/\s+/g,' ').trim();
      if(t.length<4)return;
      var sec=el.closest('section'),nm='';
      if(sec){var n=$('.acc-t .no',sec)||$('h2 .no',sec),hh=$('.acc-t',sec)||$('h2',sec);nm=hh?hh.textContent.replace(/\s+/g,' ').trim():'';if(n)nm=nm.replace(n.textContent,n.textContent+' ·')}
      if(sec&&sec.id==='mo-dau')nm='Mở đầu';
      var sa=el.closest('.sub-acc'),sub=sa?$('.sub-t',sa).textContent.trim():'';if(!sub&&el.tagName!=='H3'){var p=el;while(p&&p!==sec){var q=p.previousElementSibling;while(q){if(q.tagName==='H3'){sub=q.textContent.trim();break}q=q.previousElementSibling}if(sub)break;p=p.parentElement}}
      IDX.push({el:el,sec:sec,t:t,l:t.toLowerCase(),n:bo(t),nm:nm+(sub?' › '+sub:''),nn:bo(nm+' '+sub),h:/^H[34]$/.test(el.tagName)});
    });
  }
  function snip(it,words,exact){
    var n=exact?it.l:it.n,t=it.t,first=n.length;
    words.forEach(function(w){var i=n.indexOf(w);if(i>=0&&i<first)first=i});
    if(first===n.length)first=0;
    var a=Math.max(0,first-60),b=Math.min(t.length,a+220);if(a>0){var sp=t.lastIndexOf(' ',a+10);if(sp>a-15)a=sp+1}
    var s=t.slice(a,b),ns=n.slice(a,b),marks=[];
    words.forEach(function(w){var i=0;while((i=ns.indexOf(w,i))>=0){marks.push([i,i+w.length]);i+=w.length}});
    marks.sort(function(x,y){return x[0]-y[0]});
    var out='',p=0;marks.forEach(function(m){if(m[0]<p)return;out+=esc(s.slice(p,m[0]))+'<mark>'+esc(s.slice(m[0],m[1]))+'</mark>';p=m[1]});
    out+=esc(s.slice(p));
    return (a>0?'…':'')+out+(b<t.length?'…':'');
  }
  function run(){
    var raw=inp.value.toLowerCase().replace(/\s+/g,' ').trim(),q=bo(raw),rw=raw.split(' ');
    if(q.length<2){box.hidden=true;return}
    if(!IDX)build();
    var words=q.split(' ').filter(function(w){return w.length>0});
    hits=IDX.map(function(it){
      var all=it.n+' '+it.nn;
      for(var i=0;i<words.length;i++)if(all.indexOf(words[i])<0)return null;
      if(raw!==q){var la=it.l+' '+it.nm.toLowerCase();for(var j=0;j<rw.length;j++)if(la.indexOf(rw[j])<0)return null}
      var sc=0;if(it.l.indexOf(raw)>=0)sc+=20;else if(it.n.indexOf(q)>=0)sc+=8;if(it.nn.indexOf(q)>=0)sc+=6;if(it.h)sc+=3;
      words.forEach(function(w){if(it.n.indexOf(w)>=0)sc+=2});
      rw.forEach(function(w){if(w&&it.l.indexOf(w)>=0)sc+=4});
      if(it.t.length<40&&!it.h)sc-=3;sc-=Math.min(3,it.t.length/400);
      return {it:it,sc:sc};
    }).filter(Boolean).sort(function(a,b){return b.sc-a.sc}).slice(0,12);
    sel=-1;
    if(!hits.length){box.innerHTML='<div class="fr-none">Chưa thấy “'+esc(inp.value.trim())+'”. Thử từ khác ngắn hơn, ví dụ: nghỉ, trễ, tiền, ảnh, nhận xét.'+(passed('A')||(QL&&!AS)?'':' Phần B đang khóa nên chưa tìm được nội dung nghiệp vụ.')+'</div>';box.hidden=false;return}
    box.innerHTML=hits.map(function(h,i){return '<button type="button" data-i="'+i+'"><span class="fr-t">'+esc(h.it.nm||'Cẩm nang')+'</span><span class="fr-s">'+snip(h.it,raw!==q?rw:words,raw!==q)+'</span></button>'}).join('');
    box.hidden=false;
  }
  function go(i){
    var h=hits[i];if(!h)return;var el=h.it.el,sec=h.it.sec;
    box.hidden=true;inp.blur();document.body.classList.remove('menu-open');
    if(sec&&sec.classList.contains('acc'))setOpen(sec,true);
    var sa=el.closest('.sub-acc');if(sa)sa.classList.add('open');
    var d=el.closest('details');if(d)d.open=true;
    setTimeout(function(){var y=el.getBoundingClientRect().top+window.scrollY-top.offsetHeight-16;window.scrollTo({top:y,behavior:'smooth'});el.classList.remove('find-hit');void el.offsetWidth;el.classList.add('find-hit')},40);
  }
  var tm;inp.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(run,120)});
  inp.addEventListener('focus',function(){IDX=null;if(inp.value.trim().length>1)run()});
  inp.addEventListener('keydown',function(e){
    var bs=$$('button',box);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!bs.length)return;e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach(function(b,i){b.classList.toggle('on',i===sel)});bs[sel].scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();go(sel<0?0:sel)}
    else if(e.key==='Escape'){box.hidden=true}
  });
  box.addEventListener('mousedown',function(e){e.preventDefault()});
  box.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)go(+b.getAttribute('data-i'))});
  document.addEventListener('click',function(e){if(!e.target.closest('.find'))box.hidden=true});
}

/* ---------- scroll spy ---------- */
function spy(){
  if(!('IntersectionObserver' in window))return;
  var links={};$$('#rail a').forEach(function(a){links[a.getAttribute('href').slice(1)]=a});
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){$$('#rail a.on').forEach(function(a){a.classList.remove('on')});var a=links[e.target.id];if(a)a.classList.add('on')}})},{rootMargin:'-20% 0px -70% 0px'});
  $$('section[id]').forEach(function(s){io.observe(s)});
}

boot();
})();
</script>
